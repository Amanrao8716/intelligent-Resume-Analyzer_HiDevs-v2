[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-analyzer"
version = "1.0.0"
description = "Parse resumes and score them against a job description"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pypdf>=4.0,<6.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.30,<2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
resume-analyzer = "resume_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=resume_analyzer --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
